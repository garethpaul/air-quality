
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.8
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
            - v2-dependencies-
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            python -m pip install --upgrade "pip<25"
            python -m pip install -r requirements.txt -r requirements-dev.txt
      - run:
          name: Lint and format check
          command: |
            . venv/bin/activate
            make lint
      - run:
          name: Test
          command: |
            . venv/bin/activate
            make test
      - run:
          name: Build
          command: |
            . venv/bin/activate
            make build
      - save_cache:
          paths:
            - ./venv
          key: v2-dependencies-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}

workflows:
  build:
    jobs:
      - build
  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build
