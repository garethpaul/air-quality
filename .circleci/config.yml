
version: 2.1

jobs:
  build:
    parameters:
      python-version:
        type: string
    docker:
      - image: cimg/python:<< parameters.python-version >>
    working_directory: ~/repo
    steps:
      - checkout
      - restore_cache:
          keys:
            - v3-<< parameters.python-version >>-dependencies-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
            - v3-<< parameters.python-version >>-dependencies-
      - run:
          name: Install dependencies
          command: |
            python -m venv venv
            . venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt -r requirements-dev.txt
      - run:
          name: Lint and format check
          command: |
            . venv/bin/activate
            make lint
      - run:
          name: Test
          command: |
            . venv/bin/activate
            make test
      - run:
          name: Build
          command: |
            . venv/bin/activate
            make build
      - save_cache:
          paths:
            - ./venv
          key: v3-<< parameters.python-version >>-dependencies-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}

workflows:
  build:
    jobs:
      - build:
          matrix:
            parameters:
              python-version: ["3.12", "3.14"]
  nightly:
    triggers:
      - schedule:
          cron: "0 0 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - build:
          matrix:
            parameters:
              python-version: ["3.12", "3.14"]
